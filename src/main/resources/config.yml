# ElementalSMP configuration
# Edit these values, then run /reload or restart the server to apply them.

chambers:
  # How often (in minutes) a new Elemental Chamber rolls somewhere in the world.
  reroll-interval-minutes: 60
  # If the current chamber finishes early (cleared via kills, or every spawner
  # harvested/broken), the next roll happens after this much shorter wait instead
  # of leaving the world without an active chamber until the full interval above.
  fast-reroll-minutes: 5
  # How far from spawn (in blocks, both +/- on X and Z) a chamber can spawn.
  # Shrunk from the original 5000 so chambers are actually findable within a reasonable walk/ride.
  world-bound: 1500
  # Chance (0.0-1.0) that a rolled chamber is an Elite chamber (tougher, better loot).
  elite-chance: 0.25
  # Mob kills required to clear a normal / Elite chamber.
  kills-required-normal: 12
  kills-required-elite: 20
  # Chance (0.0-1.0) that clearing a chamber's chest includes a Storm Core or Void Tear.
  awakening-drop-chance-normal: 0.08
  awakening-drop-chance-elite: 0.20

mastery:
  # XP required to go from level N to N+1 is: xp-base-per-level + (N * xp-scaling-per-level)
  xp-base-per-level: 50
  xp-scaling-per-level: 15
  # Permanent stat bonuses per level of your ACTIVE element (switching elements changes
  # your stats to match that element's own level). At level 100 with the defaults below,
  # that's +10 max health (5 hearts) and +2 attack damage.
  health-per-level: 0.1
  damage-per-level: 0.02
  # Damage multiplier for ability casts while your active element is fused with
  # Lightning or Void (on top of the elemental counter cycle's own bonus/penalty).
  fusion-damage-multiplier: 1.2

cooldowns:
  # Ability cooldowns in seconds, per tier - these are the FLOOR (minimum) values, reached
  # at or before level 100 and never going lower.
  basic-seconds: 3
  mobility-seconds: 8
  heavy-seconds: 15
  ultimate-seconds: 30
  # At level 1, cooldowns are this many times longer than the floor values above.
  # E.g. 1.5 means Basic starts at 4.5s.
  starting-multiplier: 1.5
  # How much each level shaves off, as a fraction of the tier's floor value. 0.0333 means
  # Basic (3s floor) drops ~0.1s per level, i.e. -0.3s every 3 levels, reaching its 3s floor
  # by around level 15 and staying there - NOT a slow crawl all the way to level 100.
  # Bigger-cooldown tiers drop proportionally faster in raw seconds since they have more room.
  decrease-fraction-per-level: 0.0333

sleep:
  # Bonus Mastery XP awarded to whoever slept through the night when the server skips it.
  bonus-xp: 50

trade:
  # Spawner types shown in the "Wild Spawners" section of /element trade. Anything
  # that's actually used by a chamber theme is automatically excluded from this list
  # even if listed here, so it can never overlap the "Chamber Spawners" section.
  wild-spawners:
    - SPIDER
    - COD
    - COW
    - SHEEP
    - PIG
    - CHICKEN
    - RABBIT
    - CAVE_SPIDER
